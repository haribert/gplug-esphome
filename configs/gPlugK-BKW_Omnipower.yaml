# gPlugK (ESP32-C3, WLAN) für Kamstrup OMNIPOWER (BKW, Kundenschnittstelle KS2)
# Protokoll: HDLC / DLMS/COSEM, AES-128-GCM verschlüsselt, Push alle 10 s, 2400 Baud
# Basis: gPlugE-Konfiguration (haribert/gplug-esphome), angepasst ua für BKW Kamstrup Omnipower Zähler
#
# Datum:    2026.09.28
# Version:  1.0
#
# Im Idealfall muss einzig der Bereich `substitutions` angepasst werden.
substitutions:
  devicename: "gplugk"
  friendly_name: "gPlugK - Stromzähler"
  purpose: "Stromzähler auslesen (BKW Kamstrup OMNIPOWER)"
  project_name: "esphome.gplug"
  project_version: "1.0"
  dns_domain: ".local"
  timezone: "Europe/Zurich"
  log_level: "INFO"
  # Wandlerfaktor: 1 bei direkt messenden Zählern.
  # Bei Wandlerzählern das Wandlerverhältnis eintragen (z. B. 150/5 = 30),
  # da die KS2 laut BKW Energie, Leistung und Strom ohne Wandlerfaktor ausgibt.
  ct_factor: "1"
  # Passwort für Webzugriff
  web_server_user: admin
  web_server_password: !secret web_server_password
  # OTA Update
  current_ota_password: !secret gplugk_ota_password
  new_ota_password: !secret ota_password

esphome:
  name: "${devicename}"
  friendly_name: "${friendly_name}"
  comment: "${purpose}"
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    - priority: -10
      then:
        - lambda: |-
            if (strcmp("${current_ota_password}", "${new_ota_password}") != 0) {
              ESP_LOGI("ota_update", "OTA Passwörter unterschiedlich. Setze neues Passwort...");
              id(ota_component).set_auth_password("${new_ota_password}");
            } else {
              ESP_LOGI("ota_update", "OTA Passwörter sind identisch. Keine Änderung nötig.");
            }

# --- HARDWARE (gPlugK = ESP32-C3) ---
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source: github://jluthiger/esphome-gplugk
    components: [gplugk]
    refresh: 1d

# --- NETZWERK (WLAN) ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: "${dns_domain}"
  ap:
    ssid: "gPlugK Fallback"
    password: !secret fallback_ap_password

captive_portal:

ota:
  - platform: esphome
    id: ota_component
    password: ${current_ota_password}
  - platform: web_server

web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: ${web_server_user}
    password: ${web_server_password}
  sorting_groups:
    - id: group_total
      name: "Total"
      sorting_weight: 10
    - id: group_l1
      name: "Phase L1"
      sorting_weight: 20
    - id: group_l2
      name: "Phase L2"
      sorting_weight: 30
    - id: group_l3
      name: "Phase L3"
      sorting_weight: 40
    - id: group_net
      name: "Netzqualität"
      sorting_weight: 50
    - id: group_meter
      name: "Stromzähler"
      sorting_weight: 60
    - id: group_diag
      name: "${friendly_name}"
      sorting_weight: 70

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 86400s

logger:
  level: ${log_level}

time:
  - platform: sntp
    id: sntp_time
    timezone: "${timezone}"

# --- ZÄHLERSCHNITTSTELLE ---
uart:
  id: uart_bus
  rx_pin: GPIO4
  baud_rate: 2400
  rx_buffer_size: 1024

gplugk:
  id: my_gplugk
  uart_id: uart_bus
  # 32 Hex-Zeichen aus my.bkw.ch > Energie-Monitoring > Zählerschnittstelle
  decryption_key: !secret gplugk_decryption_key

# Grüne LED (GPIO6) blinkt bei jedem empfangenen Telegramm
output:
  - platform: gpio
    pin: GPIO6
    id: led_output

light:
  - platform: binary
    name: "LED Datenempfang"
    id: led_data
    output: led_output
    internal: true

script:
  - id: blink_led
    mode: restart
    then:
      - light.turn_on: led_data
      - delay: 500ms
      - light.turn_off: led_data

sensor:
  - platform: gplugk
    gplugk_id: my_gplugk

    # --- GRUPPE: TOTAL ---
    # Energie in Wh und Leistung in W, wie in der BKW-Tabelle.
    # In HA lässt sich die Anzeigeeinheit pro Entität auf kWh umstellen.
    active_energy_plus:
      name: "Energie Bezug (1.8.0)"
      id: energy_import
      unit_of_measurement: "Wh"
      accuracy_decimals: 0
      icon: "mdi:transmission-tower-export"
      web_server: {sorting_group_id: group_total, sorting_weight: 40}
      filters:
        - multiply: ${ct_factor}
      on_value:
        then:
          - script.execute: blink_led
    active_energy_minus:
      name: "Energie Einspeisung (2.8.0)"
      id: energy_export
      unit_of_measurement: "Wh"
      accuracy_decimals: 0
      icon: "mdi:transmission-tower-import"
      web_server: {sorting_group_id: group_total, sorting_weight: 50}
      filters:
        - multiply: ${ct_factor}

    active_power_plus:
      name: "Leistung Bezug"
      id: power_import
      icon: "mdi:transmission-tower-export"
      web_server: {sorting_group_id: group_total, sorting_weight: 10}
      filters:
        - multiply: ${ct_factor}
    active_power_minus:
      name: "Leistung Einspeisung"
      id: power_export
      icon: "mdi:transmission-tower-import"
      web_server: {sorting_group_id: group_total, sorting_weight: 11}
      filters:
        - multiply: ${ct_factor}

    reactive_energy_plus:
      name: "Blindenergie +R (3.8.0)"
      unit_of_measurement: "varh"
      device_class: ""
      accuracy_decimals: 0
      icon: "mdi:sine-wave"
      web_server: {sorting_group_id: group_net, sorting_weight: 30}
      filters:
        - multiply: ${ct_factor}
    reactive_energy_minus:
      name: "Blindenergie -R (4.8.0)"
      unit_of_measurement: "varh"
      device_class: ""
      accuracy_decimals: 0
      icon: "mdi:sine-wave"
      web_server: {sorting_group_id: group_net, sorting_weight: 31}
      filters:
        - multiply: ${ct_factor}

    reactive_power_plus:
      name: "Blindleistung Bezug"
      unit_of_measurement: "var"
      device_class: reactive_power
      icon: "mdi:sine-wave"
      web_server: {sorting_group_id: group_net, sorting_weight: 20}
      filters:
        - multiply: ${ct_factor}
    reactive_power_minus:
      name: "Blindleistung Einspeisung"
      unit_of_measurement: "var"
      device_class: reactive_power
      icon: "mdi:sine-wave"
      web_server: {sorting_group_id: group_net, sorting_weight: 21}
      filters:
        - multiply: ${ct_factor}

    power_factor:
      name: "Leistungsfaktor"
      accuracy_decimals: 2
      icon: "mdi:angle-acute"
      web_server: {sorting_group_id: group_net, sorting_weight: 10}
      filters:
        - multiply: 0.01

    # --- GRUPPE: PHASE L1 ---
    active_power_l1:
      name: "Leistung Bezug L1"
      icon: "mdi:flash"
      web_server: {sorting_group_id: group_l1, sorting_weight: 10}
      filters: [multiply: "${ct_factor}"]
    active_power_minus_l1:
      name: "Leistung Einspeisung L1"
      icon: "mdi:flash-outline"
      web_server: {sorting_group_id: group_l1, sorting_weight: 11}
      filters: [multiply: "${ct_factor}"]
    voltage_l1:
      name: "Spannung L1"
      icon: "mdi:sine-wave"
      web_server: {sorting_group_id: group_l1, sorting_weight: 20}
    current_l1:
      name: "Strom L1"
      icon: "mdi:current-ac"
      accuracy_decimals: 2
      web_server: {sorting_group_id: group_l1, sorting_weight: 30}
      filters: [multiply: 0.01, multiply: "${ct_factor}"]
    power_factor_l1:
      name: "Leistungsfaktor L1"
      accuracy_decimals: 2
      web_server: {sorting_group_id: group_l1, sorting_weight: 40}
      filters: [multiply: 0.01]
    active_energy_plus_l1:
      name: "Energie Bezug L1"
      unit_of_measurement: "Wh"
      accuracy_decimals: 0
      web_server: {sorting_group_id: group_l1, sorting_weight: 50}
      filters: [multiply: "${ct_factor}"]
    active_energy_minus_l1:
      name: "Energie Einspeisung L1"
      unit_of_measurement: "Wh"
      accuracy_decimals: 0
      web_server: {sorting_group_id: group_l1, sorting_weight: 51}
      filters: [multiply: "${ct_factor}"]

    # --- GRUPPE: PHASE L2 ---
    active_power_l2:
      name: "Leistung Bezug L2"
      icon: "mdi:flash"
      web_server: {sorting_group_id: group_l2, sorting_weight: 10}
      filters: [multiply: "${ct_factor}"]
    active_power_minus_l2:
      name: "Leistung Einspeisung L2"
      icon: "mdi:flash-outline"
      web_server: {sorting_group_id: group_l2, sorting_weight: 11}
      filters: [multiply: "${ct_factor}"]
    voltage_l2:
      name: "Spannung L2"
      icon: "mdi:sine-wave"
      web_server: {sorting_group_id: group_l2, sorting_weight: 20}
    current_l2:
      name: "Strom L2"
      icon: "mdi:current-ac"
      accuracy_decimals: 2
      web_server: {sorting_group_id: group_l2, sorting_weight: 30}
      filters: [multiply: 0.01, multiply: "${ct_factor}"]
    power_factor_l2:
      name: "Leistungsfaktor L2"
      accuracy_decimals: 2
      web_server: {sorting_group_id: group_l2, sorting_weight: 40}
      filters: [multiply: 0.01]
    active_energy_plus_l2:
      name: "Energie Bezug L2"
      unit_of_measurement: "Wh"
      accuracy_decimals: 0
      web_server: {sorting_group_id: group_l2, sorting_weight: 50}
      filters: [multiply: "${ct_factor}"]
    active_energy_minus_l2:
      name: "Energie Einspeisung L2"
      unit_of_measurement: "Wh"
      accuracy_decimals: 0
      web_server: {sorting_group_id: group_l2, sorting_weight: 51}
      filters: [multiply: "${ct_factor}"]

    # --- GRUPPE: PHASE L3 ---
    active_power_l3:
      name: "Leistung Bezug L3"
      icon: "mdi:flash"
      web_server: {sorting_group_id: group_l3, sorting_weight: 10}
      filters: [multiply: "${ct_factor}"]
    active_power_minus_l3:
      name: "Leistung Einspeisung L3"
      icon: "mdi:flash-outline"
      web_server: {sorting_group_id: group_l3, sorting_weight: 11}
      filters: [multiply: "${ct_factor}"]
    voltage_l3:
      name: "Spannung L3"
      icon: "mdi:sine-wave"
      web_server: {sorting_group_id: group_l3, sorting_weight: 20}
    current_l3:
      name: "Strom L3"
      icon: "mdi:current-ac"
      accuracy_decimals: 2
      web_server: {sorting_group_id: group_l3, sorting_weight: 30}
      filters: [multiply: 0.01, multiply: "${ct_factor}"]
    power_factor_l3:
      name: "Leistungsfaktor L3"
      accuracy_decimals: 2
      web_server: {sorting_group_id: group_l3, sorting_weight: 40}
      filters: [multiply: 0.01]
    active_energy_plus_l3:
      name: "Energie Bezug L3"
      unit_of_measurement: "Wh"
      accuracy_decimals: 0
      web_server: {sorting_group_id: group_l3, sorting_weight: 50}
      filters: [multiply: "${ct_factor}"]
    active_energy_minus_l3:
      name: "Energie Einspeisung L3"
      unit_of_measurement: "Wh"
      accuracy_decimals: 0
      web_server: {sorting_group_id: group_l3, sorting_weight: 51}
      filters: [multiply: "${ct_factor}"]

    # --- GRUPPE: STROMZÄHLER ---
    # OBIS 1.1.0.0.1.255 – Zähler Identifikation 1
    meter_id:
      name: "Zähler Identifikation"
      icon: "mdi:barcode-scan"
      entity_category: diagnostic
      web_server: {sorting_group_id: group_meter, sorting_weight: 10}

  # Netto-Leistung: positiv = Bezug, negativ = Einspeisung
  - platform: template
    name: "Leistung Netto"
    id: power_net
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:transmission-tower"
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(power_import).state) || std::isnan(id(power_export).state)) {
        return {};
      }
      return id(power_import).state - id(power_export).state;
    web_server: {sorting_group_id: group_total, sorting_weight: 5}

  # --- SYSTEM DIAGNOSE ---
  - platform: internal_temperature
    name: "CPU Temperatur"
    icon: "mdi:thermometer"
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 10}

  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 15}

text_sensor:
  - platform: gplugk
    gplugk_id: my_gplugk
    timestamp:
      name: "Zeitstempel Zähler"
      icon: "mdi:clock-outline"
      entity_category: diagnostic
      web_server: {sorting_group_id: group_meter, sorting_weight: 20}
    # OBIS 1.1.0.2.129.255 – OBIS-Listen-Identifikation (z. B. "Kamstrup_V0001")
    meter_name:
      name: "OBIS-Listen-ID"
      icon: "mdi:information"
      entity_category: diagnostic
      web_server: {sorting_group_id: group_meter, sorting_weight: 30}

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    icon: "mdi:alpha-v-circle-outline"
    web_server: {sorting_group_id: group_diag, sorting_weight: 20}
    filters:
      - lambda: |-
          std::string version = x;
          char m_str[4];
          int day, year;
          static const char month_names[] = "JanFebMarAprMayJunJulAugSepOctNovDec";
          sscanf(__DATE__, "%3s %d %d", m_str, &day, &year);
          int month = (strstr(month_names, m_str) - month_names) / 3 + 1;
          int hour, min, sec;
          sscanf(__TIME__, "%d:%d:%d", &hour, &min, &sec);
          char buf[20];
          snprintf(buf, sizeof(buf), "%04d%02d%02d_%02d%02d%02d", year, month, day, hour, min, sec);
          return {"esphome-" + version + " - " + std::string(buf)};

  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      icon: "mdi:ip-network"
      web_server: {sorting_group_id: group_diag, sorting_weight: 30}
    mac_address:
      name: "MAC-Adresse"
      icon: "mdi:fingerprint"
      web_server: {sorting_group_id: group_diag, sorting_weight: 40}
